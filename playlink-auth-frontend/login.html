<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayLink — Log in</title>
  <link rel="stylesheet" href="styles.css"></head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="brand-panel"><a class="brand" href="index.html" aria-label="PlayLink home"><img class="brand-full-logo" src="assets/playlink-logo.png" alt="PlayLink — Find Courts. Join Games. Play Together."></a><div class="brand-copy"><span class="eyebrow">THE GAME STARTS HERE</span><h1>Your team<br><span class="green">is waiting.</span></h1><p>Pick up where you left off and find your next opportunity to play.</p></div></section>
    <section class="form-panel"><div class="form-wrap">
      <div class="mobile-brand"><img class="brand-full-logo" src="assets/playlink-logo.png" alt="PlayLink — Find Courts. Join Games. Play Together."></div>
      <div class="form-heading"><span class="eyebrow">GOOD TO SEE YOU AGAIN</span><h2>Log in to PlayLink</h2><p>Use your email or unique username.</p></div>
      <form id="loginForm" novalidate>
        <label for="identity">Email or username</label><input id="identity" name="identity" autocomplete="username" placeholder="you@example.com or username" required>
        <label for="loginPassword">Password</label><div class="password-wrap"><input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="show-password" type="button" data-toggle="loginPassword">Show</button></div>
        <div class="form-options"><label class="remember"><input type="checkbox" id="remember"> <span>Remember me</span></label><a href="forgot-password.html">Forgot password?</a></div>
        <button class="primary-btn" type="submit">Log in <span aria-hidden="true">→</span></button>
        <div class="divider"><span>or log in with</span></div>
        <button class="google-btn" type="button" data-demo="Google login"><span class="google-g">G</span> Continue with Google</button>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
      </form>
      <p class="switch-copy">New to PlayLink? <a href="index.html">Create an account</a></p>
    </div></section>
  </main><script src="app.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PlayLink — Reset password</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page"><main class="auth-shell">
<section class="brand-panel"><a class="brand" href="index.html" aria-label="PlayLink home"><img class="brand-full-logo" src="assets/playlink-logo.png" alt="PlayLink — Find Courts. Join Games. Play Together."></a><div class="brand-copy"><span class="eyebrow">A FRESH START</span><h1>Reset it.<br>Get back to<br><span class="green">the game.</span></h1><p>Choose a strong password to secure your PlayLink account.</p></div></section>
<section class="form-panel"><div class="form-wrap"><div class="mobile-brand"><img class="brand-full-logo" src="assets/playlink-logo.png" alt="PlayLink — Find Courts. Join Games. Play Together."></div><a class="back-link" href="login.html">← Back to login</a><div class="form-heading"><span class="eyebrow">SECURE YOUR ACCOUNT</span><h2>Choose a new password</h2><p>Use at least 8 characters. Avoid reusing a password from another site.</p></div>
<form id="resetForm" novalidate><label for="newPassword">New password</label><div class="password-wrap"><input id="newPassword" type="password" minlength="8" placeholder="Enter a new password" required><button class="show-password" type="button" data-toggle="newPassword">Show</button></div><label for="newPasswordConfirm">Confirm new password</label><div class="password-wrap"><input id="newPasswordConfirm" type="password" placeholder="Enter it again" required><button class="show-password" type="button" data-toggle="newPasswordConfirm">Show</button></div><button class="primary-btn" type="submit">Save new password <span aria-hidden="true">→</span></button><p class="form-message" id="formMessage" role="status" aria-live="polite"></p></form><p class="switch-copy"><a href="login.html">Return to login</a></p></div></section>
</main><script src="app.js"></script></body></html>
